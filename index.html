<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quieres regresar conmigo</title>
  <style>
    :root {
      --bg-base: #FBEFEF;
      --bg-card: #FFE2E2;
      --accent-soft: #F5CBCB;
      --accent-primary: #C5B3D3;
      --text-dark: #4A3B4E;
      --text-muted: #7B6780;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-base);
      color: var(--text-dark);
      padding: 20px;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    #capa-particulas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }

    .card {
      background-color: var(--bg-card);
      border: 2px solid var(--accent-soft);
      border-radius: 20px;
      padding: 40px 28px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 12px 30px rgba(197, 179, 211, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      position: relative;
      z-index: 2;
    }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2.3rem);
      letter-spacing: 0.04em;
      color: var(--text-dark);
      line-height: 1.2;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin: 8px 0;
    }

    button {
      padding: 12px 30px;
      font-size: 1.1rem;
      font-weight: 700;
      border: 2px solid transparent;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    #btn-si {
      background-color: var(--accent-primary);
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(197, 179, 211, 0.45);
    }

    #btn-si:hover {
      background-color: #B39DC4;
    }

    #btn-no {
      background-color: var(--bg-base);
      color: var(--text-muted);
      border-color: var(--accent-soft);
    }

    #btn-no:hover {
      background-color: var(--accent-soft);
      color: var(--text-dark);
    }

    #mensaje {
      min-height: 44px;
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.4;
    }

    .texto-ruego {
      color: #8E4A5C;
      animation: sacudida 0.35s ease;
    }

    .texto-exito {
      color: #5C4670;
      font-size: 1.3rem;
    }

    .memes {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      width: 100%;
      height: clamp(110px, 22vh, 160px);
    }

    .memes img {
      height: 100%;
      max-width: 48%;
      object-fit: contain;
      mix-blend-mode: multiply;
      animation: aparece 0.35s ease;
    }

    @keyframes aparece {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .particula {
      position: absolute;
      top: -40px;
      animation: caer linear forwards;
    }

    @keyframes caer {
      0% {
        transform: translateY(0) rotate(0deg) scale(0.8);
        opacity: 1;
      }
      85% {
        opacity: 1;
      }
      100% {
        transform: translateY(110vh) rotate(25deg) scale(1.1);
        opacity: 0;
      }
    }

    @keyframes sacudida {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      50% { transform: translateX(6px); }
      75% { transform: translateX(-4px); }
    }
  </style>
</head>

      <button id="btn-no" type="button">no</button>
    </div>

    <p id="mensaje"></p>
  </main>

      memesBox.innerHTML = "";

    function crearCorazonSVG(roto) {
      const colores = roto
        ? ["#8E4A5C", "#B56576", "#9E5A6B"]
        : ["#C5B3D3", "#E5989B", "#D4A5C9"];
      const color = colores[Math.floor(Math.random() * colores.length)];

      if (!roto) {
        return `
          <svg viewBox="0 0 32 32" width="100%" height="100%" fill="${color}">
            <path d="M16 28.5C16 28.5 3 20.2 3 11.2C3 6.9 6.4 3.5 10.6 3.5C13.1 3.5 15.2 4.7 16 6.6C16.8 4.7 18.9 3.5 21.4 3.5C25.6 3.5 29 6.9 29 11.2C29 20.2 16 28.5 16 28.5Z"/>
          </svg>
        `;
      }

      return `
        <svg viewBox="0 0 34 32" width="100%" height="100%" fill="${color}">
          <path d="M15.2 28.2C15.2 28.2 2.5 20.1 2.5 11.2C2.5 6.9 5.9 3.5 10.1 3.5C12.5 3.5 14.5 4.6 15.4 6.4L13.4 11.5L16.5 15.5L13.8 20.5L15.2 28.2Z"/>

        const el = document.createElement("div");
        el.className = "particula";

        const tamano = Math.floor(Math.random() * 18) + 20; // 20px a 38px
        const left = Math.random() * 94;
        const duracion = (Math.random() * 1.6 + 2.2).toFixed(2); // 2.2s a 3.8s
        const retraso = (Math.random() * 0.4).toFixed(2);

        el.style.width = `${tamano}px`;
        el.style.height = `${tamano}px`;
        el.style.left = `${left}vw`;
        el.style.animationDuration = `${duracion}s`;
        el.style.animationDelay = `${retraso}s`;
        el.innerHTML = crearCorazonSVG(roto);

        capaParticulas.appendChild(el);

        setTimeout(() => {
          el.remove();
        }, (parseFloat(duracion) + parseFloat(retraso)) * 1000 + 100);
      }
    }

    let huyendo = false;

    function registrarIntento() {
      const indice = intentosNo % frasesRuego.length;
      mensaje.textContent = frasesRuego[indice];
      mensaje.classList.remove("texto-ruego", "texto-exito");
      void mensaje.offsetWidth;
      mensaje.classList.add("texto-ruego");

      lanzarParticulas(12, true);
      mostrarMemes([secuenciaTriste[Math.min(intentosNo, secuenciaTriste.length - 1)]]);
      intentosNo++;

      escalaSi = Math.min(escalaSi + 0.15, 2.6);
      btnSi.style.transform = `scale(${escalaSi})`;

      if (intentosNo === 3) btnNo.textContent = "segura?";
      if (intentosNo === 5) btnNo.textContent = "piénsalo";
      if (intentosNo >= 7) btnNo.textContent = "no hay salida";
    }

    function escapar(cx, cy) {
      const w = btnNo.offsetWidth, h = btnNo.offsetHeight;
      const si = btnSi.getBoundingClientRect();
      const margen = 10;
      let mejor = null, mejorDist = -1;
      for (let i = 0; i < 25; i++) {
        const x = margen + Math.random() * (window.innerWidth - w - margen * 2);
        const y = margen + Math.random() * (window.innerHeight - h - margen * 2);
        const solapa = x < si.right + 12 && x + w > si.left - 12 && y < si.bottom + 12 && y + h > si.top - 12;
        if (solapa) continue;
        const d = Math.hypot(x + w / 2 - cx, y + h / 2 - cy);
        if (d > mejorDist) { mejorDist = d; mejor = { x, y }; }
      }
      if (!mejor) mejor = { x: margen, y: margen };
      btnNo.style.position = "fixed";
      btnNo.style.left = `${mejor.x}px`;
      btnNo.style.top = `${mejor.y}px`;
      btnNo.style.zIndex = "5";
      btnNo.style.transition = "left 0.25s ease, top 0.25s ease";
    }

    // Radio de alerta: crece junto con el botón "si"
    function radio() { return 70 + (escalaSi - 1) * 90; }

    document.addEventListener("pointermove", (e) => {
      if (!huyendo || btnSi.style.display === "none" || btnNo.style.display === "none") return;
      const r = btnNo.getBoundingClientRect();
      const d = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
      if (d < radio()) {
        escapar(e.clientX, e.clientY);
        registrarIntento();
      }
    });

    // En pantallas táctiles: huye antes de que el dedo lo toque
    btnNo.addEventListener("pointerdown", (e) => {
      if (!huyendo) return;
      e.preventDefault();
      escapar(e.clientX, e.clientY);
      registrarIntento();
    });

    btnNo.addEventListener("click", (e) => {
      if (huyendo) { e.preventDefault(); return; }
      registrarIntento();
      // Tras el primer "no", empieza a huir
      huyendo = true;
      escapar(e.clientX, e.clientY);
    });

    btnSi.addEventListener("click", () => {
      mensaje.textContent = "Sabía que dirías que sí. Gracias por darme otra oportunidad.";
      mensaje.classList.remove("texto-ruego");
      mensaje.classList.add("texto-exito");
      btnNo.style.display = "none";
      mostrarMemes(["abrazo", "pareja"]);
      huyendo = false;
      btnSi.style.transform = "scale(1.15)";

      // Ráfaga inicial de corazones completos y lluvia constante
      lanzarParticulas(25, false);
      if (!intervaloLluvia) {
        intervaloLluvia = setInterval(() => {
          lanzarParticulas(6, false);
        }, 700);
      }
    });
  </script>
</body>
</html>
